  <text x="600" y="152" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="104" font-weight="800" fill="#ff3d6e" fill-opacity="0.35" transform="translate(4,0)">CHAOS.IT</text>
  <text x="600" y="152" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="104" font-weight="800" fill="#ffffff">CHAOS<tspan fill="url(#accent)">.IT</tspan></text>

