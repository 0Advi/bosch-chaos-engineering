schema_version: 1
# Execution policy for payment capabilities. P0 gate: nothing is live.
# Enabling a capability requires: execution_enabled: true, its ID in
# live_capabilities, an approved config/sandbox.yaml, and a reviewed PR (P2).
policy_version: "p0-2026-10-10"
execution_enabled: false
live_capabilities: []
max_duration_seconds: 30
# The app URL comes from BOSCH_APP_PORT (deploy/demo.env, deploy/demo.local.env).
# Measured payment gates live in config/payment_policy.yaml (make derive-policy);
# P2 replaces the provisional values below with those gates.
request_timeout_seconds: 10           # provisional until payment_policy.yaml exists
recovery_checks: 3                    # valid checkouts that must pass after restoration
