schema_version: 1
# Configuration contract for the future controller; not an executable experiment.
execution_enabled: false
sandbox:
  compose_project: bosch-chaos-sandbox
  network: bosch-chaos-sandbox
  require_dedicated_docker_environment: true
safety:
  allowed_services: [recommendation]
  allowed_faults: [service_stop]
  max_concurrent_experiments: 1
  max_duration_seconds: 30
  require_healthy_baseline: true
  fail_closed_on_missing_observations: true
  observation_max_age_seconds: 5
  request_timeout_seconds: 2
  require_recovery_verification: true
  thresholds:
    affected_request_error_rate: 0.25
    protected_request_error_rate: 0.05
    protected_p95_latency_ms: 1500
    minimum_samples: 10
    window_seconds: 10
    protected_health_required: true
experiments:
  - id: recommendation-outage
    target: recommendation
    fault: service_stop
    duration_seconds: 20
    affected_probe: /api/recommendations?currencyCode=USD
    protected_probes: [/, /api/products]
    recovery: start_same_container_and_verify_api
# Thresholds are initial proposals. Validate against real baseline measurements.
# Cart and checkout must also be checked during end-to-end startup verification.
