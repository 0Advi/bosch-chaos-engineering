name: Validate repository setup
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate workbench state and transport boundaries
        run: make test-workbench
      - name: Install pinned controller test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate controller contracts and scope without live execution
        run: make test
      - name: Check generated schemas and healthy flag definitions
        run: |
          python -m controller.schemas.export --check
          make flags
      - name: Validate selected deployment and isolation configuration
        run: make validate
