# Bosch overlay for the pinned core + observability deployment.
# Requires Docker Compose 2.24.4+ for reset/override tags.
networks:
  default:
    name: bosch-chaos-sandbox
services:
  ad:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  cart:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  checkout:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  currency:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  email:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  frontend:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  frontend-proxy:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${BOSCH_APP_PORT:-8080}:8080"
    pull_policy: build
  image-provider:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  load-generator:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  payment:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  product-catalog:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  quote:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  recommendation:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  shipping:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  flagd:
    container_name: !reset null
    ports: !reset []
  flagd-ui:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  telemetry-docs:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  astronomy-db:
    container_name: !reset null
    ports: !reset []
  valkey-cart:
    container_name: !reset null
    ports: !reset []
  otel-collector:
    container_name: !reset null
    ports: !reset []
    command: !override
      - --config=/etc/otelcol-config.yml
      - --config=/etc/otelcol-config-observability.yml
      - --config=/etc/otelcol-config-extras.yml
      - --config=/etc/collector-sandbox.yaml
      - --feature-gates=service.profilesSupport
    volumes:
      - ../../deploy/collector-sandbox.yaml:/etc/collector-sandbox.yaml:ro
  jaeger:
    container_name: !reset null
    ports: !reset []
  grafana:
    container_name: !reset null
    ports: !reset []
  prometheus:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${BOSCH_METRICS_PORT:-9090}:9090"
  opensearch:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
  opamp-server:
    container_name: !reset null
    ports: !reset []
    pull_policy: build
