# Bosch overlay for the pinned core + observability deployment.
# Requires Docker Compose 2.24.4+ for reset/override tags.
networks:
  default:
    name: bosch-chaos-sandbox
services:
  ad:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  cart:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  checkout:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  currency:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  email:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  frontend:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  frontend-proxy:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${BOSCH_APP_PORT:-8080}:8080"
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  image-provider:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  load-generator:
    command: ["--locustfile", "/usr/src/app/locust.sandbox.py"]
    volumes:
      - ../../deploy/locust.sandbox.py:/usr/src/app/locust.sandbox.py:ro
    environment:
      - LOCUST_BROWSER_TRAFFIC_ENABLED=${BOSCH_BROWSER_TRAFFIC_ENABLED:-false}
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  payment:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  product-catalog:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  quote:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  recommendation:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  shipping:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  flagd:
    container_name: !reset null
    ports: !reset []
  flagd-ui:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  telemetry-docs:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
  astronomy-db:
    container_name: !reset null
    ports: !reset []
  valkey-cart:
    container_name: !reset null
    ports: !reset []
  otel-collector:
    container_name: !reset null
    ports: !reset []
    command: !override
      - --config=/etc/otelcol-config.yml
      - --config=/etc/otelcol-config-observability.yml
      - --config=/etc/otelcol-config-extras.yml
      - --config=/etc/collector-sandbox.yaml
      - --feature-gates=service.profilesSupport
    volumes:
      - ../../deploy/collector-sandbox.yaml:/etc/collector-sandbox.yaml:ro
  jaeger:
    container_name: !reset null
    ports: !reset []
  grafana:
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:${BOSCH_APP_PORT:-8080}/grafana/
    container_name: !reset null
    ports: !reset []
  prometheus:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${BOSCH_METRICS_PORT:-9090}:9090"
  opensearch:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
    healthcheck:
      start_period: 180s
      retries: 20
  opamp-server:
    container_name: !reset null
    ports: !reset []
    pull_policy: ${BOSCH_PULL_POLICY:-missing}
